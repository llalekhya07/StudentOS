<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StudentOS</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#266a8c">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <!-- Runs BEFORE first paint so the saved theme applies with no flash.
       A plain script (not a module) on purpose: modules are deferred and would run too late. -->
  <script>
    try {
      const saved = localStorage.getItem('studentos.theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = saved || (prefersDark ? 'dark' : 'light');
    } catch (e) { document.documentElement.dataset.theme = 'light'; }
  </script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <div class="brand">StudentOS</div>
      <nav id="nav"></nav>
    </aside>
    <div class="scrim" id="scrim" hidden></div>

    <div class="main-col">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" type="button"
                aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false">&#9776;</button>
        <h1 id="pageTitle">StudentOS</h1>
        <div class="topbar-actions">
          <label class="sr-only" for="semesterSelect">Active semester</label>
          <select id="semesterSelect"><option value="">No semester yet</option></select>
          <button class="icon-btn" id="themeBtn" type="button" aria-label="Switch to dark theme">&#9680;</button>
        </div>
      </header>
      <main id="main" tabindex="-1"></main>
    </div>
  </div>

  <dialog id="modal" aria-modal="true"></dialog>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
